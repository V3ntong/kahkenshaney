name: amongapp
description: "AI-Powered Lost & Found application with OTP-based authentication."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_functions: ^6.3.5
  http: ^1.2.0
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  image_picker: ^1.2.3
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/placeholder_item.png
